<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stash Keep - Save Secure Text & Markdown Memo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📗 Stash Keep</h1>
        <p class="subtitle" id="subtext">Securely save up to 4.75 MB in LocalStorage. Raw Text, Rendered HTML & Markdown Editor.</p>
        <div style="margin-top: 15px; display: flex; justify-content: center; gap: 10px; align-items: center;">
            <a href="https://github.com/SweetForest/StashKeep" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background-color: #24292e; color: #ffffff; border: 1px solid var(--border); border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: background-color 0.2s;">
                <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor" style="display: inline-block; vertical-align: middle;">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                GitHub
            </a>
            <select id="langSelector" onchange="changeLanguage(this.value)" style="padding: 8px 12px; background-color: var(--container-bg); color: var(--text-color); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.9rem; height: 38px;">
                </select>
        </div>
    </header>

    <main>
        <div class="storage-monitor">
            <div class="storage-info">
                <span id="labelStorage">LocalStorage Space</span>
                <span id="storageText"></span>
            </div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div class="input-container">
            <textarea id="mainInput" placeholder="Type plain text or Markdown here..." rows="3" oninput="updateInputStats()"></textarea>
            <div class="input-footer">
                <span class="char-counter" id="mainStats">0 characters (0 Bytes)</span>
                
                <div class="action-inputs-group">
                    <input type="text" id="mainKey" class="title-input secret-key-mask" placeholder="Secret Key (Optional)" style="max-width: 140px;" autocomplete="off">
                    <input type="text" id="mainTitle" class="title-input" placeholder="Add title...">
                    <select id="mainType" class="type-select">
                        <option value="">text</option>
                        <option value="2">md</option>
                    </select>
                    <button class="btn-add" id="btnAdd" onclick="handleStashClick()">Stash It</button>
                </div>
            </div>
        </div>

        <div id="pinnedTitle" class="section-title" style="display: none;">Pinned</div>
        <div id="pinnedList" class="stash-list" ondragover="allowDrop(event)" ondrop="handleDrop(event, true)"></div>

        <div id="notesTitle" class="section-title" style="display: none;">Notes</div>
        <div id="notesList" class="stash-list" ondragover="allowDrop(event)" ondrop="handleDrop(event, false)"></div>

        <div id="emptyMessage" class="empty-state">No stashed items found.</div>
    </main>

    <script src="app.js"></script>
</body>
</html>
