<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stash Keep - Save Secure Text & Markdown Memo</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>📗 Stash Keep</h1>
            <div class="header-controls">
                <button id="themeToggle" class="icon-btn" onclick="toggleTheme()" title="Toggle theme">☀️</button>
                <a href="https://github.com/SweetForest/StashKeep" target="_blank" rel="noopener noreferrer" class="github-link">
                    <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                    </svg> GitHub
                </a>
                <select id="langSelector" onchange="changeLanguage(this.value)" class="lang-select"></select>
            </div>
        </div>
        <p class="subtitle" id="subtext">Save text in Local Storage. Raw Text, Markdown.</p>
    </header>

    <main>
        <div class="storage-monitor">
            <div class="storage-info">
                <span id="labelStorage">Local Storage Space</span>
                <span id="storageText">0 / 0 Bytes</span>
            </div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div class="search-action-bar">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search title, content or tags...">
            </div>
            <div class="toolbar-actions">
                <button class="action-tool-btn" onclick="exportAllData()">📤 Export JSON</button>
                <button class="action-tool-btn" onclick="triggerImportAll()">📥 Import JSON</button>
            </div>
        </div>

        <div id="tagFilterContainer" class="tag-filter-container" style="display:none;"></div>

        <div class="input-container">
           <div class="md-toolbar" id="mdToolbar">
            <button class="md-tool-btn" onclick="insertMd('**', '**')" title="Bold">B</button>
            <button class="md-tool-btn" onclick="insertMd('_', '_')" title="Italic">I</button>
            <button class="md-tool-btn" onclick="insertMd('~~', '~~')" title="Strikethrough">S</button>
            <div class="md-tool-sep"></div>
            <button class="md-tool-btn" onclick="insertMd('# ', '')" title="H1">H1</button>
            <button class="md-tool-btn" onclick="insertMd('## ', '')" title="H2">H2</button>
            <button class="md-tool-btn" onclick="insertMd('### ', '')" title="H3">H3</button>
            <div class="md-tool-sep"></div>
            <button class="md-tool-btn" onclick="insertMd('- ', '')" title="Bullet List">•</button>
            <button class="md-tool-btn" onclick="insertMd('1. ', '')" title="Numbered List">1.</button>
            <button class="md-tool-btn" onclick="insertMd('> ', '')" title="Quote">”</button>
            <div class="md-tool-sep"></div>
            <button class="md-tool-btn" onclick="insertMd('[', '](url)')" title="Link">Link</button>
            <button class="md-tool-btn" onclick="insertMd('![alt](', ')')" title="Image">Img</button>
            <button class="md-tool-btn" onclick="insertMd('`', '`')" title="Inline Code">Code</button>
            <button class="md-tool-btn" onclick="insertMd('```\n', '\n```')" title="Code Block">Block</button>
        </div>
            <textarea id="mainInput" placeholder="Type plain text or Markdown here..." oninput="updateInputStats()"></textarea>

            <div class="input-footer">
                <span class="char-counter" id="mainStats">0 chars · 0 words · 0 B</span>
                <div class="action-inputs-group">
                    <input type="text" id="mainKey" class="title-input secret-key-mask" placeholder="🔑 Secret Key" style="max-width:120px;" autocomplete="off">
                    <input type="text" id="mainTags" class="title-input" placeholder="🏷 tags, comma" style="max-width:130px;">
                    <input type="text" id="mainTitle" class="title-input" placeholder="Add title...">
                    <select id="mainType" class="type-select">
                        <option value="">text</option>
                        <option value="2">md</option>
                    </select>
                    <button class="btn-add" id="btnAdd" onclick="handleStashClick()">Stash It</button>
                </div>
            </div>
        </div>

        <div id="pinnedTitle" class="section-title" style="display:none;">Pinned</div>
        <div id="pinnedList" class="stash-list" ondragover="allowDrop(event)" ondrop="handleDrop(event, true)"></div>

        <div id="notesTitle" class="section-title" style="display:none;">Notes</div>
        <div id="notesList" class="stash-list" ondragover="allowDrop(event)" ondrop="handleDrop(event, false)"></div>

        <div id="emptyMessage" class="empty-state">No stashed items found.</div>
    </main>

    <script src="app.js"></script>
</body>
</html>
